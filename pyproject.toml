[project]
name = "multi-agent-customer-service"
version = "0.1.0"
description = "基于 Multi-Agent 的智能客服业务平台（售前/售中/售后/投诉，含人工审批与离线评测）"
requires-python = ">=3.12"

# 依赖以本文件为唯一真源（uv sync）。不再维护 requirements.txt，避免两处清单各说各话。
# 版本下限按"代码用到的 API"来定：interrupt/Command 与 PostgresSaver 需要 langgraph 1.x。
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    # Agent / LLM（LangChain 负责模型与 Tool Calling 适配，LangGraph 负责编排）
    "openai>=1.58",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    # RAG
    "pymilvus>=2.4",
    "milvus-lite>=3.0",
    "rank-bm25>=0.2.2",
    # 文档解析
    "pdfplumber>=0.11",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # 存储
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    # 出网
    "httpx>=0.28",
    "duckduckgo-search>=7.0",
    # 后台鉴权
    "PyJWT>=2.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# backend 进 sys.path，测试与脚本都不用再写 sys.path.insert
pythonpath = ["backend"]
addopts = "-q"
markers = [
    "integration: 需要真实 PostgreSQL/Redis 的端到端自检（无外部服务时自动跳过）",
]
